<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tibbers AMZ Tool</title>
    <meta
      name="description"
      content="Amazon US 运营分析工具前台"
    />
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f4f6f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      section {
        width: min(100%, 640px);
        padding: 40px;
        border: 1px solid #dfe4ea;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 12px 32px rgb(23 32 51 / 8%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: #526174;
        line-height: 1.7;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 24px;
        color: #176b46;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .status::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22a06b;
        content: "";
      }

      @media (max-width: 520px) {
        section {
          padding: 28px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Tibbers AMZ Tool</h1>
        <p>Amazon US 运营分析工具前台已准备就绪。</p>
        <div class="status">基础页面运行正常</div>
      </section>
    </main>
  </body>
</html>
